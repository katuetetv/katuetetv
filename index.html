<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katuete TV — En Vivo</title>
  <meta name="description" content="Katuete TV — Transmisión en Vivo. Señal continua de televisión online sin interrupciones." />
  <meta name="keywords" content="Katuete TV, televisión en vivo, señal online, transmisión directa" />
  <meta property="og:title" content="Katuete TV — En Vivo" />
  <meta property="og:description" content="Señal continua de televisión online sin interrupciones." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Partículas de fondo sutiles -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- Header minimalista -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="katuetetvlogo.png" alt="Katuete TV" class="logo-img" />
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>EN VIVO</span>
      </div>
    </div>
  </header>

  <!-- Única Sección Principal: Transmisión en Vivo -->
  <main class="main-content">
    <section class="player-section" id="player-section">
      <div class="section-header">
        <h1 class="section-title">Transmisión <span class="gradient-text">en Vivo</span></h1>
        <p class="section-subtitle">Señal continua de televisión online sin interrupciones</p>
      </div>

      <div class="player-single-layout">
        <div class="player-container" id="playerContainer">
          <!-- Barra superior del player -->
          <div class="player-header-bar">
            <div class="live-indicator">
              <span class="live-dot-sm"></span>
              <span id="currentProgramTitle">Katuete TV — Señal Oficial en Vivo</span>
            </div>
            <div class="player-controls-top">
              <span class="player-time" id="playerTime">--:--:--</span>
            </div>
          </div>

          <!-- Pantalla del video 100% limpia sin botones encima -->
          <div class="player-wrapper" id="playerWrapper">
            <iframe
              id="ytIframe"
              src="https://www.youtube-nocookie.com/embed/Er5iy1Cyovg?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&loop=1&playlist=Er5iy1Cyovg&playsinline=1&enablejsapi=1"
              title="Katuete TV — Transmisión en Vivo"
              frameborder="0"
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>

          <!-- Barra de controles abajo de la pantalla -->
          <div class="player-bottom-bar">
            <!-- 1. Botón Play / Pausa -->
            <button class="player-btn" id="btnPlayPause" aria-label="Reproducir o pausar transmisión">
              <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="iconPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
              <span id="textPlayPause">Pausar</span>
            </button>

            <!-- 2. Botón Activar / Silenciar Sonido (Abajo de la pantalla) -->
            <button class="player-btn player-btn-audio pulse-audio" id="btnAudio" aria-label="Activar o desactivar sonido">
              <svg id="iconMuted" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
              <svg id="iconUnmuted" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <span id="textAudio">Activar Sonido</span>
            </button>

            <!-- 3. Botón Pantalla Completa -->
            <button class="player-btn" id="btnFullscreen" aria-label="Expandir a pantalla completa">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
              <span>Pantalla Completa</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer discreto -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="katuetetvlogo.png" alt="Katuete TV" class="footer-logo-img" />
      </div>
      <p class="footer-copy">&copy; 2026 Katuete TV — Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
